<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="utf-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width,initial-scale=1.0">
		<link rel="stylesheet" href="./reset.css">
		<link rel="icon" type="image/svg+xml" href="/favicon.svg">
		<title>Zigout — Brick Breaker in Zig + WebAssembly</title>
		<meta name="description" content="Zigout: a fast brick-breaker arcade game written in Zig and compiled to WebAssembly. Use the arrow keys to move the paddle and clear every brick.">
		<style>
			:root {
				--bg: #1b2631;
				--bg-glow: #2c3e50;
				--fg: floralwhite;
				--frame: #34495e;
			}
			
			html,
			body {
				height: 100%;
			}
			
			body {
				font-family: 'Avenir', Helvetica, Arial, sans-serif;
				-webkit-font-smoothing: antialiased;
				-moz-osx-font-smoothing: grayscale;
				background: radial-gradient(ellipse at center, var(--bg-glow) 0%, var(--bg) 75%);
				background-color: var(--bg);
				color: var(--fg);
				overflow: hidden;
			}
			
			#main {
				position: relative;
				height: 100svh;
				display: grid;
				place-items: center;
				padding: 16px;
			}
			
			#canvas {
				display: block;
				/* scale down to fit the viewport while keeping aspect ratio */
				max-width: 100%;
				max-height: calc(100svh - 32px);
				width: auto;
				height: auto;
				border: 2px solid var(--frame);
				border-radius: 6px;
				box-shadow:
				0 0 0 6px rgba(0, 0, 0, 0.25),
				0 20px 50px rgba(0, 0, 0, 0.55);
				image-rendering: pixelated;
				image-rendering: crisp-edges;
			}
		</style>
	</head>

	<body>
		<main id="main">
			<canvas id="canvas"></canvas>
		</main>
		<script type="module" src="./index.ts">
		</script>
	</body>
</html>
