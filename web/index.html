<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="utf-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
		<meta name="theme-color" content="#1b2631">
		<link rel="stylesheet" href="./reset.css">
		<link rel="stylesheet" href="./style.css">
		<link rel="icon" type="image/svg+xml" href="/favicon.svg">
		<title>Z-Break — Brick Breaker in Zig + WebAssembly</title>
		<meta name="description" content="Zigout: a fast brick-breaker arcade game written in Zig and compiled to WebAssembly. Use the arrow keys to move the paddle and clear every brick.">
	</head>

	<body>
		<div id="app">
			<header id="head">
				<img src="/favicon.svg" alt="" aria-hidden="true">
				<h1>Z<span>-Break</span></h1>
				<span class="tag">Zig + Wasm</span>
			</header>

			<main id="stage">
				<canvas id="canvas" tabindex="0" aria-label="Zigout game canvas"></canvas>
				<div id="loader" role="status">
					<div class="ball"></div>
					<p id="loader-text">Loading…</p>
				</div>
			</main>

			<div id="gate" role="dialog" aria-modal="true" aria-labelledby="gate-title" hidden>
				<div class="phone" aria-hidden="true"></div>
				<h2 id="gate-title">Full screen required</h2>
				<p>Z-Break plays in full screen landscape. Tap below to start.</p>
				<button id="fl-btn" type="button">Play full screen</button>
				<p id="gate-error" class="gate-error" hidden></p>
			</div>
			<footer>
				<ul id="controls" aria-label="Keyboard controls">
					<li><kbd>←</kbd><kbd>→</kbd>
					or <kbd>A</kbd><kbd>D</kbd>
					Move</li>
					<li><kbd>Space</kbd>
					Launch / Pause</li>
					<li><kbd>R</kbd>
					Restart</li>
				</ul>
			</footer>
		</div>
		<script type="module" src="./index.ts">
		</script>
	</body>
</html>
